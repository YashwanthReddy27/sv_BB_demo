<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Athlete history · SportsVision.AI</title>
<link rel="stylesheet" href="../sportsvision/sportsvision.css">
<link rel="stylesheet" href="../theme.css">
</head>
<body>
<main class="page-main" id="main">
  <header>
    <p class="label">Athlete history</p>
    <h1 class="title" id="h-title">Past results</h1>
  </header>
  <form class="card" id="pick" style="display:flex;gap:12px;align-items:end;flex-wrap:wrap">
    <div class="field" style="flex:1;min-width:220px">
      <label for="athlete">Athlete</label>
      <select class="input" id="athlete"></select>
    </div>
  </form>
  <section class="card" aria-labelledby="list-h">
    <h2 class="sr-only" id="list-h">Results</h2>
    <div id="list"></div>
  </section>
</main>
<script type="module">
  import { nav, $, esc, params, SHOTS, results, fmtDate } from '../app.js';
  nav();
  const names = [...new Set(results.all().map((r) => r.athlete.trim()))].sort((a, b) => a.localeCompare(b));
  const sel = $('#athlete');
  const current = params.get('athlete') || names[0] || '';
  sel.innerHTML = names.length ? names.map((n) => `<option${n.toLowerCase() === current.toLowerCase() ? ' selected' : ''}>${esc(n)}</option>`).join('') : '<option value="">No athletes yet</option>';
  const render = () => {
    const name = sel.value;
    $('#h-title').textContent = name ? `${name}` : 'Past results';
    const rows = name ? results.byAthlete(name).reverse() : [];
    $('#list').innerHTML = rows.length ? `<div class="table-wrap"><table>
      <thead><tr><th scope="col">Date</th><th scope="col">Level</th><th scope="col">Session type</th><th scope="col">Clip</th><th scope="col">Notes</th><th scope="col"><span class="sr-only">Open</span></th></tr></thead>
      <tbody>${rows.map((r) => `<tr><td class="num">${fmtDate(r.date)}</td><td>${esc(r.level)}</td><td><span class="tag accent">${esc(r.type)}</span></td>
        <td>${esc(SHOTS[r.shot]?.label || '')}</td><td>${r.notes ? 'Yes' : '–'}</td>
        <td><a class="btn btn-secondary" href="results.html?id=${r.id}">View results</a></td></tr>`).join('')}</tbody></table></div>`
      : `<div class="empty"><p style="margin:0 0 16px">No results saved yet.</p><a class="btn btn-primary" href="upload.html">Upload a session</a></div>`;
  };
  sel.addEventListener('change', () => { history.replaceState(null, '', `?athlete=${encodeURIComponent(sel.value)}`); render(); });
  render();
</script>
</body>
</html>
