<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Train With Us · Academy</title>
<meta name="description" content="A 12-month academy with filmed sessions, monthly progress reviews and an end-of-season report for every athlete.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Geist+Mono:wght@400;500&family=Geist:wght@400;500;600&family=Instrument+Serif:ital@1&display=swap">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/pages/academy.css">
<script type="module" src="/js/pages/academy.js"></script>
</head>
<body>
<main id="main">
  <section class="ac-hero wrap" aria-labelledby="ac-title">
    <div class="ac-hero-copy">
      <span class="label">12-month program</span>
      <h1 id="ac-title">A year of <em class="s">tracked</em> development.</h1>
      <dl class="ac-facts" id="ac-facts"></dl>
      <div class="btn-row" id="ac-cta"></div>
    </div>
    <figure class="board ac-board" id="ac-board"></figure>
  </section>

  <section class="section wrap" aria-labelledby="pillars-title">
    <div class="ac-intro">
      <div>
        <span class="label">01 — The program</span>
        <h2 id="pillars-title">Five pillars, <em class="s">one</em> plan.</h2>
      </div>
      <p class="lead" id="ac-intro"></p>
    </div>
    <ol class="hgrid pillars" id="pillars"></ol>
  </section>

  <section class="section wrap" aria-labelledby="film-title">
    <span class="label">02 — Your year on film</span>
    <h2 id="film-title">Measured every <em class="s">month.</em></h2>
    <div class="ac-year">
      <ol class="timeline" id="timeline"></ol>
      <div class="dash" id="dash" aria-label="Sample dashboard"></div>
    </div>
  </section>

  <section class="section wrap" aria-labelledby="faq-title">
    <div class="ac-faq">
      <div>
        <span class="label">03 — Questions</span>
        <h2 id="faq-title">Before you <em class="s">apply.</em></h2>
      </div>
      <div id="faq"></div>
    </div>
  </section>
</main>
</body>
</html>
