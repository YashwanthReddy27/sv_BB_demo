<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Train With Us · Schedule</title>
<meta name="description" content="Find and book a session by program, age group, coach and day. Every session is filmed, and every athlete gets a feedback report.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Geist+Mono:wght@400;500&family=Geist:wght@400;500;600&family=Instrument+Serif:ital@1&display=swap">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/pages/schedule.css">
<script type="module" src="/js/pages/schedule.js"></script>
</head>
<body data-no-popup>
<main id="main">
  <header class="sc-hero wrap">
    <span class="label">Schedule</span>
    <h1>Book your next <em class="s">session.</em></h1>
    <p class="lead">Filter by program, age group, coach or day. Every session is filmed, and a feedback report follows it.</p>
  </header>

  <section class="sc-body wrap" aria-label="Session schedule">
    <div class="sc-filters card" id="filters"></div>

    <div class="sc-bar">
      <p class="sc-count" id="count" role="status" aria-live="polite"></p>
      <div class="sc-views" role="tablist" aria-label="Schedule view">
        <button class="chip" type="button" role="tab" id="tab-list" aria-controls="panel-list" aria-selected="true">List</button>
        <button class="chip" type="button" role="tab" id="tab-week" aria-controls="panel-week" aria-selected="false" tabindex="-1">Week</button>
      </div>
    </div>

    <div id="panel-list" role="tabpanel" aria-labelledby="tab-list" tabindex="0"></div>
    <div id="panel-week" role="tabpanel" aria-labelledby="tab-week" tabindex="0" hidden></div>
  </section>
</main>
</body>
</html>
